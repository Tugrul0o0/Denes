<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kontrol Paneli</title>
    <link rel="stylesheet" href="panel.style.css">
</head>
<body>
    <div class="container">
        <h1>Karakter Seçimi</h1>
        <ul id="character-list">
            <li data-character="cube">Yeşil Küp</li>
            <li data-character="sphere">Mavi Küre</li>
            <li data-character="cone">Kırmızı Koni</li>
        </ul>
    </div>

    <div class="separator"></div>

    <div class="container">
        <h1>Not Defteri</h1>
        <div id="notes-list-container">
            <h3>Notlarım</h3>
            <ul id="notes-list">
                <!-- Notlar buraya dinamik olarak eklenecek -->
            </ul>
        </div>
        <div id="note-editor">
            <input type="text" id="note-title" placeholder="Not Başlığı...">
            <textarea id="note-content" placeholder="Notunuzu buraya yazın..."></textarea>
            <div id="note-controls">
                <button id="btn-new-note">Yeni Not</button>
                <button id="btn-save-note">Kaydet</button>
                <button id="btn-delete-note">Sil</button>
            </div>
        </div>
    </div>

    <script src="panel.renderer.js"></script>
</body>
</html>
